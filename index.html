<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>David Kankowski</title>
<meta name="description" content="David Kankowski — Technical Product Manager at Cotality." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
  }

  body {
    background: #ffffff;
    color: #111111;
    font-family: 'EB Garamond', Georgia, serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  .card {
    width: 100%;
    max-width: 1100px;
    min-height: 78vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    font-size: 1.05rem;
  }

  .phone {
    letter-spacing: 0.02em;
  }

  .school {
    text-align: right;
  }

  .school-name {
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem;
    font-weight: 600;
  }

  .school-sub {
    font-size: 0.98rem;
    color: #333;
    margin-top: 0.2rem;
  }

  .center {
    text-align: center;
    padding: 3rem 0;
  }

  .name {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-variant: small-caps;
    letter-spacing: 0.02em;
    font-size: clamp(2.6rem, 6vw, 4.4rem);
    line-height: 1.05;
  }

  .email-row {
    margin-top: 1rem;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .email-link {
    font-size: 1.4rem;
    color: #111111;
    text-decoration: none;
  }

  .email-link:hover {
    text-decoration: underline;
  }

  .bottom-row {
    text-align: center;
    font-size: 1.15rem;
    color: #222;
  }

  .bottom-row a {
    color: #111111;
    font-weight: 600;
    text-decoration: none;
  }

  .bottom-row a:hover {
    text-decoration: underline;
  }

  .divider {
    padding: 0 0.6rem;
    color: #999;
  }

  @media (max-width: 640px) {
    .top-row {
      flex-direction: column;
      gap: 1rem;
    }
    .school { text-align: left; }
    .bottom-row { font-size: 1rem; }
  }
</style>
</head>
<body>
<div class="card">
  <div class="top-row">
    <div class="phone">858-798-6680</div>
    <div class="school">
      <div class="school-name">UC Santa Barbara</div>
      <div class="school-sub">Statistics and Data Science</div>
    </div>
  </div>

  <div class="center">
    <div class="name">David Kankowski</div>
    <div class="email-row">
      <a class="email-link" href="mailto:davidkanko12@gmail.com">davidkanko12@gmail.com</a>
    </div>
  </div>

  <div class="bottom-row">
    San Diego, CA<span class="divider">|</span>Technical Product Manager at Cotality<span class="divider">|</span><a href="resume.pdf" target="_blank" rel="noopener noreferrer">Resume</a>
  </div>
</div>
</body>
</html>
